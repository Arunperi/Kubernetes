name: Infra CI

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-check:
    strategy:
      fail-fast: false
      matrix:
        tf_dir:
          - infra/terraform/s3
          - infra/terraform/ecr
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: ${{ matrix.tf_dir }}
      do_apply: false
    secrets: inherit
      
  backend-setup:
    needs: terraform-check
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/terraform/s3
      do_apply: true
    secrets: inherit
        