name: Infra CI

on:
  push:
    branches:
      - main
    paths:
      - "infra/environments/**"
      - "infra/modules/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/environments/**"
      - "infra/modules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-check:
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/s3
      do_apply: false
    secrets: inherit

  backend-setup:
    needs: s3-check
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/s3
      do_apply: true
    secrets: inherit

  vpc-apply:
    needs: backend-setup
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/vpc
      do_apply: true
    secrets: inherit

  iam-apply:
    needs: vpc-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/iam
      do_apply: true
    secrets: inherit

  ecr-apply:
    needs: iam-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/ecr
      do_apply: true
    secrets: inherit

  eks-apply:
    needs: ecr-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/eks
      do_apply: true
    secrets: inherit

  ec2-apply:
    needs: eks-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: infra/environments/dev/ec2
      do_apply: true
    secrets: inherit

  cleanup-on-failure:
    needs:
      - backend-setup
      - vpc-apply
      - iam-apply
      - ecr-apply
      - eks-apply
      - ec2-apply
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Destroy resources in reverse dependency order
        shell: bash
        run: |
          set -uo pipefail

          modules=(
            "infra/environments/dev/ec2"
            "infra/environments/dev/eks"
            "infra/environments/dev/ecr"
            "infra/environments/dev/iam"
            "infra/environments/dev/vpc"
            "infra/environments/dev/s3"
          )

          cleanup_failed=0

          for module_path in "${modules[@]}"; do
            if [ -d "$module_path" ]; then
              echo "Destroying $module_path"
              terraform -chdir="$module_path" init || {
                echo "Init failed for $module_path, continuing"
                cleanup_failed=1
                continue
              }

              terraform -chdir="$module_path" destroy -auto-approve || {
                echo "Destroy failed for $module_path, continuing"
                cleanup_failed=1
              }
            fi
          done

          if [ "$cleanup_failed" -ne 0 ]; then
            echo "One or more cleanup steps failed"
            exit 1
          fi
