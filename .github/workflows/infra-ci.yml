name: Infra CI

on:
  push:
    branches:
      - main
    paths:
      - "terraform/environments/**"
      - "terraform/modules/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "terraform/environments/**"
      - "terraform/modules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-check:
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: terraform/environments/dev/s3
      do_apply: false
    secrets: inherit

  backend-setup:
    needs: s3-check
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: terraform/environments/dev/s3
      do_apply: true
    secrets: inherit

  vpc-apply:
    needs: backend-setup
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: terraform/environments/dev/vpc
      do_apply: true
    secrets: inherit

  iam-apply:
    needs: vpc-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: terraform/environments/dev/iam
      do_apply: true
    secrets: inherit

  ecr-apply:
    needs: iam-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: terraform/environments/dev/ecr
      do_apply: true
    secrets: inherit

  eks-apply:
    needs: ecr-apply
    uses: ./.github/workflows/infra-reusable-ci.yml
    with:
      module_path: terraform/environments/dev/eks
      do_apply: true
    secrets: inherit
